services:
  web-server:
    image: nginx:latest
    ports:
      - "80:80"
    volumes:
      - ./data:/usr/share/nginx/html/data
      - ./index.html:/usr/share/nginx/html/index.html
      - ./style.css:/usr/share/nginx/html/style.css
      - ./favicon.ico:/usr/share/nginx/html/favicon.ico
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
